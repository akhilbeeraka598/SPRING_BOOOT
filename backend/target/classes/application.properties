# MySQL Configuration (Ready for Production/Docker)
# spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mydb}
# spring.datasource.username=${DB_USER:root}
# spring.datasource.password=${DB_PASSWORD:password}

# H2 File Persistence (Best for Local Dev without MySQL)
spring.datasource.url=jdbc:h2:file:./data/testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT settings
jwt.secret=${JWT_SECRET:secretkeysecretkeysecretkeysecretkeysecretkeysecretkey}
jwt.expiration=86400000

# File Upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS
cors.allowed-origins=*
